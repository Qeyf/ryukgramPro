name: Recovery behavior tests
on:
  pull_request:
    paths:
      - 'src/SCIDashParser.*'
      - 'src/ActionButton/SCIMediaMetadata.*'
      - 'tests/recovery/**'
      - 'scripts/recovery/test-native.sh'
      - '.github/workflows/recovery-tests.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/recovery/test-native.sh
