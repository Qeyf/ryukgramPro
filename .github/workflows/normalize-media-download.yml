name: Normalize Profile Media Long-Press Hook

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-media-download.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Expand profile long-press branches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Features/Media/MediaDownload.xm")
          text = path.read_text()
          old = '''- (void)viewLongPressedWithGesture:(UILongPressGestureRecognizer *)gesture {
              if (![SCIUtils getBoolPref:@"zoom_profile_photo"]) { %orig; return; }
              if (gesture.state != UIGestureRecognizerStateBegan) { %orig; return; }'''
          new = '''- (void)viewLongPressedWithGesture:(UILongPressGestureRecognizer *)gesture {
              if (![SCIUtils getBoolPref:@"zoom_profile_photo"]) {
                  %orig(gesture);
                  return;
              }
              if (gesture.state != UIGestureRecognizerStateBegan) {
                  %orig(gesture);
                  return;
              }'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one profile long-press match, found {text.count(old)}")
          text = text.replace(old, new, 1)
          text = text.replace('''
              %orig;
          }

          %end''', '''
              %orig(gesture);
          }

          %end''', 1)
          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Features/Media/MediaDownload.xm
          git diff --cached --check
          git commit -m "fix: expand profile media long-press Logos hook"
          git push origin HEAD:codex/ios27-universal-dylib
