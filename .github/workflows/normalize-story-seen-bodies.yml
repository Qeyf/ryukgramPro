name: Normalize Story Seen Hook Bodies

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-story-seen-bodies.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Expand Logos method bodies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Features/StoriesAndMessages/DisableStorySeen.x")
          text = path.read_text()

          replacements = {
              '- (void)markItemAsSeen:(id)arg1 { if (sciShouldBlockSeenVisual() && !sciIsPKAllowed(arg1)) return; %orig; }': '''- (void)markItemAsSeen:(id)arg1 {
              if (sciShouldBlockSeenVisual() && !sciIsPKAllowed(arg1)) return;
              %orig(arg1);
          }''',
              '- (void)_markItemAsSeen:(id)arg1 { if (sciShouldBlockSeenVisual() && !sciIsPKAllowed(arg1)) return; %orig; }': '''- (void)_markItemAsSeen:(id)arg1 {
              if (sciShouldBlockSeenVisual() && !sciIsPKAllowed(arg1)) return;
              %orig(arg1);
          }''',
              '- (void)storySeenStateDidChange:(id)arg1 { if (sciShouldBlockSeenVisual()) return; %orig; }': '''- (void)storySeenStateDidChange:(id)arg1 {
              if (sciShouldBlockSeenVisual()) return;
              %orig(arg1);
          }''',
              '- (void)markCurrentItemAsSeen { if (sciShouldBlockSeenVisual()) return; %orig; }': '''- (void)markCurrentItemAsSeen {
              if (sciShouldBlockSeenVisual()) return;
              %orig;
          }''',
              '- (void)sendSeenRequestForCurrentItem { if (sciShouldBlockSeenNetwork()) return; %orig; }': '''- (void)sendSeenRequestForCurrentItem {
              if (sciShouldBlockSeenNetwork()) return;
              %orig;
          }''',
              '- (void)markAsSeen { if (sciShouldBlockSeenVisualForObj(self)) return; %orig; }': '''- (void)markAsSeen {
              if (sciShouldBlockSeenVisualForObj(self)) return;
              %orig;
          }''',
              '- (BOOL)hasUnseenMedia { if (sciShouldBlockSeenVisualForObj(self)) return YES; return %orig; }': '''- (BOOL)hasUnseenMedia {
              if (sciShouldBlockSeenVisualForObj(self)) return YES;
              return %orig;
          }''',
              '- (BOOL)isSeen { if (sciShouldBlockSeenVisualForObj(self)) return NO; return %orig; }': '''- (BOOL)isSeen {
              if (sciShouldBlockSeenVisualForObj(self)) return NO;
              return %orig;
          }''',
              '- (BOOL)hasSeen { if (sciShouldBlockSeenVisualForObj(self)) return NO; return %orig; }': '''- (BOOL)hasSeen {
              if (sciShouldBlockSeenVisualForObj(self)) return NO;
              return %orig;
          }''',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Features/StoriesAndMessages/DisableStorySeen.x
          git diff --cached --check
          git commit -m "fix: expand story seen Logos hook bodies"
          git push origin HEAD:codex/ios27-universal-dylib
