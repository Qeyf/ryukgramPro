name: Validate Repost Crash Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - src/ActionButton/SCIRepostCrashGuard.m
      - .github/workflows/validate-repost-crash-fix.yml

permissions:
  contents: read

concurrency:
  group: validate-repost-crash-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dylib:
    name: universal dylib
    runs-on: macos-26
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest runnable Xcode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          CANDIDATES=(
            /Applications/Xcode_27*.app
            /Applications/Xcode_26.6.app
            /Applications/Xcode_26*.app
            /Applications/Xcode.app
          )
          SELECTED_DEVELOPER_DIR=""
          for XCODE_APP in "${CANDIDATES[@]}"; do
            CANDIDATE_DIR="$XCODE_APP/Contents/Developer"
            if [[ -x "$CANDIDATE_DIR/usr/bin/xcodebuild" ]] &&
               DEVELOPER_DIR="$CANDIDATE_DIR" "$CANDIDATE_DIR/usr/bin/xcodebuild" -version >/dev/null 2>&1; then
              SELECTED_DEVELOPER_DIR="$CANDIDATE_DIR"
              break
            fi
          done
          if [[ -z "$SELECTED_DEVELOPER_DIR" ]]; then
            SELECTED_DEVELOPER_DIR="$(xcode-select -p)"
          fi
          echo "DEVELOPER_DIR=$SELECTED_DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install latest Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Prepare FFmpegKit device frameworks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/setup-ffmpegkit.sh
          ./scripts/setup-ffmpegkit.sh

      - name: Build universal dylib
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh dylib 2>&1 | tee build-repost-crash-fix.log

      - name: Validate output architectures
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/RyukGram.dylib
          ARCHS="$(lipo -archs packages/RyukGram.dylib)"
          echo "Architectures: $ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          grep -qw arm64e <<< "$ARCHS"
          xcrun vtool -show-build packages/RyukGram.dylib

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repost-crash-fix-build-log-${{ github.sha }}
          path: build-repost-crash-fix.log
          if-no-files-found: warn
          retention-days: 3
