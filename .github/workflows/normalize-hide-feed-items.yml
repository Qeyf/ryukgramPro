name: Normalize Feed Filtering Orig Expressions

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-hide-feed-items.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Store original lists before filtering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Features/Feed/HideFeedItems.xm")
          text = path.read_text()

          replacements = {
              '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              NSArray *filteredObjs = removeItemsInList(%orig, YES);''': '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              NSArray *originalObjects = %orig(arg1);
              NSArray *filteredObjs = removeItemsInList(originalObjects, YES);''',
              '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              NSArray *filteredList = removeItemsInList(%orig, NO);''': '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              NSArray *originalObjects = %orig(arg1);
              NSArray *filteredList = removeItemsInList(originalObjects, NO);''',
              '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              if ([SCIUtils getBoolPref:@"hide_ads"]) {
                  return removeItemsInList(%orig, NO);
              }

              return %orig;
          }''': '''- (NSArray *)objectsForListAdapter:(id)arg1 {
              NSArray *originalObjects = %orig(arg1);
              if ([SCIUtils getBoolPref:@"hide_ads"]) {
                  return removeItemsInList(originalObjects, NO);
              }

              return originalObjects;
          }''',
          }

          # First two patterns are unique. The conditional pattern is used five times.
          first = list(replacements.items())[0]
          second = list(replacements.items())[1]
          conditional = list(replacements.items())[2]

          if text.count(first[0]) != 1:
              raise SystemExit(f"Expected one main feed match, found {text.count(first[0])}")
          text = text.replace(first[0], first[1], 1)

          if text.count(second[0]) != 1:
              raise SystemExit(f"Expected one Sundial feed match, found {text.count(second[0])}")
          text = text.replace(second[0], second[1], 1)

          conditional_count = text.count(conditional[0])
          if conditional_count != 5:
              raise SystemExit(f"Expected five conditional feed matches, found {conditional_count}")
          text = text.replace(conditional[0], conditional[1])

          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Features/Feed/HideFeedItems.xm
          git diff --cached --check
          git commit -m "fix: store original feed lists before filtering"
          git push origin HEAD:codex/ios27-universal-dylib
