name: Normalize Remaining Logos Hooks

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-logos.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Normalize orig expressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Tweak.x")
          text = path.read_text()

          liquid_old = 'return [SCIUtils liquidGlassEnabledBool:%orig];'
          liquid_new = '''_Bool originalValue = %orig;
              return [SCIUtils liquidGlassEnabledBool:originalValue];'''
          if text.count(liquid_old) != 6:
              raise SystemExit(f"Expected 6 liquid-glass matches, found {text.count(liquid_old)}")
          text = text.replace(liquid_old, liquid_new)

          void_old = 'VOID_HANDLESCREENSHOT(%orig);'
          void_new = '''if ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return;
              %orig;'''
          if text.count(void_old) != 11:
              raise SystemExit(f"Expected 11 void screenshot matches, found {text.count(void_old)}")
          text = text.replace(void_old, void_new)

          nonvoid_old = 'NONVOID_HANDLESCREENSHOT(%orig);'
          nonvoid_new = '''if ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return nil;
              return %orig;'''
          if text.count(nonvoid_old) != 4:
              raise SystemExit(f"Expected 4 non-void screenshot matches, found {text.count(nonvoid_old)}")
          text = text.replace(nonvoid_old, nonvoid_new)

          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Tweak.x
          git diff --cached --check
          git commit -m "fix: normalize remaining Logos orig expressions"
          git push origin HEAD:codex/ios27-universal-dylib
