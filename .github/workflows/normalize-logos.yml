name: Normalize Remaining Logos Hooks

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-logos.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Normalize orig expressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Tweak.x")
          text = path.read_text()

          # Non-void must be normalized before the shorter VOID token.
          text = text.replace(
              'NONVOID_HANDLESCREENSHOT(%orig);',
              '''if ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return nil;
              return %orig;''',
          )
          text = text.replace(
              'VOID_HANDLESCREENSHOT(%orig);',
              '''if ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return;
              %orig;''',
          )
          text = text.replace(
              'return [SCIUtils liquidGlassEnabledBool:%orig];',
              '''_Bool originalValue = %orig;
              return [SCIUtils liquidGlassEnabledBool:originalValue];''',
          )

          # Repair the four expressions produced by the earlier prefix-order pass.
          text = text.replace(
              '''NONif ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return;
              %orig;''',
              '''if ([SCIUtils getBoolPref:@"remove_screenshot_alert"]) return nil;
              return %orig;''',
          )

          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/Tweak.x; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Tweak.x
          git diff --cached --check
          git commit -m "fix: repair non-void Logos screenshot hooks"
          git push origin HEAD:codex/ios27-universal-dylib
