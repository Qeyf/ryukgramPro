# Builds an LCSign-compatible standalone RyukGram dylib. Pull requests validate
# the binary only. Every successful main build increments the patch version,
# commits it, tags it, and publishes exactly one raw dylib release asset.
name: Build and Release RyukGram Dylib

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "Makefile"
      - "build.sh"
      - "control"
      - ".github/workflows/build-dylib.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Makefile"
      - "build.sh"
      - "control"
      - ".github/workflows/build-dylib.yml"
  workflow_dispatch:
    inputs:
      require_ios27_sdk:
        description: Fail unless an iOS 27 SDK is installed on the runner
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ryukgram-dylib-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dylib:
    name: LCSign-compatible arm64 dylib
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-version]') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      REQUIRE_IOS27: ${{ github.event_name == 'workflow_dispatch' && inputs.require_ios27_sdk || false }}

    steps:
      - name: Checkout RyukGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(awk '/^Version:/ { print $2; exit }' control)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::control contains an invalid semantic version: $CURRENT_VERSION"
            exit 1
          fi

          RELEASE_ENABLED=false
          BUILD_VERSION="$CURRENT_VERSION"

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Versioned releases may only be built from main."
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            BUILD_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            RELEASE_ENABLED=true

            python3 - "$BUILD_VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]

          control = pathlib.Path("control")
          control_text = control.read_text()
          control_text, count = re.subn(
              r"(?m)^Version:\s*[^\n]+$",
              f"Version: {version}",
              control_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to update Version in control")
          control.write_text(control_text)

          tweak = pathlib.Path("src/Tweak.x")
          tweak_text = tweak.read_text()
          tweak_text, count = re.subn(
              r'NSString \*SCIVersionString\s*=\s*@"v[^"]+";',
              f'NSString *SCIVersionString = @"v{version}";',
              tweak_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to update SCIVersionString in src/Tweak.x")
          tweak.write_text(tweak_text)
          PY
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Build version: $BUILD_VERSION"
          echo "Release enabled: $RELEASE_ENABLED"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_enabled=$RELEASE_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Select newest runnable Xcode
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          CANDIDATES=(
            /Applications/Xcode_27*.app
            /Applications/Xcode_26.6.app
            /Applications/Xcode_26*.app
            /Applications/Xcode.app
          )

          SELECTED_DEVELOPER_DIR=""
          for XCODE_APP in "${CANDIDATES[@]}"; do
            CANDIDATE_DIR="$XCODE_APP/Contents/Developer"
            if [[ -x "$CANDIDATE_DIR/usr/bin/xcodebuild" ]] &&
               DEVELOPER_DIR="$CANDIDATE_DIR" "$CANDIDATE_DIR/usr/bin/xcodebuild" -version >/dev/null 2>&1; then
              SELECTED_DEVELOPER_DIR="$CANDIDATE_DIR"
              break
            fi
          done

          if [[ -z "$SELECTED_DEVELOPER_DIR" ]]; then
            SELECTED_DEVELOPER_DIR="$(xcode-select -p)"
          fi

          export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

          XCODE_VERSION="$(xcodebuild -version | head -n 1 | awk '{print $2}')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"

          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "IPHONEOS_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

          echo "Selected Xcode: $XCODE_VERSION"
          echo "Selected iPhoneOS SDK: $SDK_VERSION"

          if [[ "$REQUIRE_IOS27" == "true" && "$SDK_MAJOR" -lt 27 ]]; then
            echo "::error::Strict iOS 27 SDK mode requested, but the runner provides iPhoneOS $SDK_VERSION."
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install latest Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Build universal source dylib
        shell: bash
        run: |
          set -o pipefail
          chmod +x build.sh
          ./build.sh dylib 2>&1 | tee build-dylib.log

      - name: Prepare unsigned thin arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          DYLIB="packages/RyukGram.dylib"
          THIN_DYLIB="packages/RyukGram.arm64.dylib"
          test -f "$DYLIB"

          SOURCE_ARCHS="$(lipo -archs "$DYLIB")"
          echo "Compiled source architectures: $SOURCE_ARCHS"
          grep -qw arm64 <<< "$SOURCE_ARCHS"
          grep -qw arm64e <<< "$SOURCE_ARCHS"

          # Sideloaded Instagram is an arm64 process. Shipping one thin arm64
          # slice avoids legacy on-device ZSign/LCSign fat-binary parser bugs.
          lipo "$DYLIB" -thin arm64 -output "$THIN_DYLIB"
          mv "$THIN_DYLIB" "$DYLIB"

          # The IPA signer must create the only signature. Remove any Theos/ldid
          # ad-hoc signature and its LC_CODE_SIGNATURE load command beforehand.
          codesign --remove-signature "$DYLIB" 2>/dev/null || true

      - name: Validate LCSign-compatible Mach-O
        shell: bash
        run: |
          set -euo pipefail

          DYLIB="packages/RyukGram.dylib"
          test -f "$DYLIB"

          ARCHITECTURES="$(lipo -archs "$DYLIB")"
          echo "Release architectures: $ARCHITECTURES"
          [[ "$ARCHITECTURES" == "arm64" ]]

          file "$DYLIB"
          xcrun vtool -show-build "$DYLIB"

          echo "Linked libraries:"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | tail -n +2 | grep -Eiq 'ffmpegkit|libav(codec|device|filter|format|util)|libsw(resample|scale)'; then
            echo "::error::Standalone dylib contains a hard FFmpegKit/libav dependency."
            exit 1
          fi

          if codesign -d "$DYLIB" >/dev/null 2>&1; then
            echo "::error::Release dylib is already signed; LCSign must receive an unsigned Mach-O."
            exit 1
          fi

          python3 - "$DYLIB" <<'PY'
          import pathlib
          import struct
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()

          MH_MAGIC_64 = 0xFEEDFACF
          CPU_TYPE_ARM64 = 0x0100000C
          MH_DYLIB = 0x6
          LC_CODE_SIGNATURE = 0x1D

          if len(data) < 32:
              raise SystemExit("Mach-O is shorter than mach_header_64")

          header = struct.unpack_from("<IiiIIIII", data, 0)
          magic, cpu_type, _cpu_subtype, file_type, ncmds, sizeofcmds, _flags, _reserved = header

          if magic != MH_MAGIC_64:
              raise SystemExit(f"Expected a thin little-endian Mach-O 64 binary, magic=0x{magic:08x}")
          if cpu_type != CPU_TYPE_ARM64:
              raise SystemExit(f"Expected CPU_TYPE_ARM64, got 0x{cpu_type:08x}")
          if file_type != MH_DYLIB:
              raise SystemExit(f"Expected MH_DYLIB, got filetype={file_type}")

          command_start = 32
          command_end = command_start + sizeofcmds
          if command_end > len(data):
              raise SystemExit("Mach-O load-command table exceeds file size")

          cursor = command_start
          for index in range(ncmds):
              if cursor + 8 > command_end:
                  raise SystemExit(f"Load command {index} header exceeds sizeofcmds")
              command, command_size = struct.unpack_from("<II", data, cursor)
              if command_size < 8:
                  raise SystemExit(f"Load command {index} has invalid cmdsize={command_size}")
              if cursor + command_size > command_end:
                  raise SystemExit(f"Load command {index} exceeds load-command table")
              if command == LC_CODE_SIGNATURE:
                  raise SystemExit("LC_CODE_SIGNATURE remains in release dylib")
              cursor += command_size

          if cursor != command_end:
              raise SystemExit(
                  f"Load-command cursor mismatch: parsed={cursor - command_start}, expected={sizeofcmds}"
              )

          print(f"Validated unsigned thin arm64 Mach-O: {ncmds} load commands, no LC_CODE_SIGNATURE")
          PY

          shasum -a 256 "$DYLIB"

      - name: Commit successful release version
        if: steps.version.outputs.release_enabled == 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control src/Tweak.x
          git commit -m "chore(release): v${BUILD_VERSION} [release-version]"
          git push origin HEAD:main

          TAG="v${BUILD_VERSION}"
          git tag -a "$TAG" -m "RyukGram ${TAG}"
          git push origin "$TAG"

      - name: Publish dylib-only GitHub Release
        if: steps.version.outputs.release_enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          set -euo pipefail

          TAG="v${BUILD_VERSION}"
          ASSET="RyukGram-v${BUILD_VERSION}.dylib"
          cp packages/RyukGram.dylib "$ASSET"

          SHA256="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          NOTES=$(cat <<EOF
          LCSign-compatible standalone RyukGram dylib.

          - Version: ${BUILD_VERSION}
          - Architecture: arm64 thin Mach-O
          - Code signature: intentionally absent; the IPA signer creates it
          - Xcode: ${XCODE_VERSION}
          - iPhoneOS SDK: ${IPHONEOS_SDK_VERSION}
          - Deployment target: iOS 15.0+
          - Runtime target: Instagram 434 / iOS 27
          - FFmpegKit: optional; no hard framework dependency
          - SHA-256: ${SHA256}
          EOF
          )

          gh release create "$TAG" "$ASSET" \
            --target "$(git rev-parse HEAD)" \
            --title "RyukGram ${TAG}" \
            --notes "$NOTES"
