name: Normalize Enhanced Playback Tap Hooks

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-enhanced-playback.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Expand tap hook bodies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Features/Reels/EnhancedPlayback.xm")
          text = path.read_text()

          old_photo = '''%hook IGSundialViewerPhotoCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (sciIsPhotoMuteEnabled()) { sciToggleStoryAudio(); return; }
              %orig;
          }
          %end'''
          new_photo = '''%hook IGSundialViewerPhotoCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (sciIsPhotoMuteEnabled()) {
                  sciToggleStoryAudio();
                  return;
              }
              %orig(gc, tap);
          }
          %end'''

          old_carousel_photo = '''%hook IGSundialViewerCarouselPhotoCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (sciIsPhotoMuteEnabled()) { sciToggleStoryAudio(); return; }
              %orig;
          }
          %end'''
          new_carousel_photo = '''%hook IGSundialViewerCarouselPhotoCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (sciIsPhotoMuteEnabled()) {
                  sciToggleStoryAudio();
                  return;
              }
              %orig(gc, tap);
          }
          %end'''

          old_carousel = '''%hook IGSundialViewerCarouselCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (!sciIsPhotoMuteEnabled()) { %orig; return; }
              BOOL hasVideo = NO, hasPhoto = NO;
              NSMutableArray<UIView *> *stack = [NSMutableArray arrayWithObject:self];
              for (int d = 0; d < 6 && stack.count && !hasVideo; d++) {
                  NSMutableArray<UIView *> *next = [NSMutableArray array];
                  for (UIView *sub in stack) {
                      NSString *cls = NSStringFromClass([sub class]);
                      if ([cls isEqualToString:@"IGSundialViewerCarouselVideoCell"]) {
                          if (!CGRectIsEmpty(CGRectIntersection(sub.bounds, self.bounds)) &&
                              sub.window) hasVideo = YES;
                      } else if ([cls isEqualToString:@"IGSundialViewerCarouselPhotoCell"]) {
                          if (!CGRectIsEmpty(CGRectIntersection(sub.bounds, self.bounds)) &&
                              sub.window) hasPhoto = YES;
                      }
                      for (UIView *s in sub.subviews) [next addObject:s];
                  }
                  stack = next;
              }
              if (hasPhoto && !hasVideo) { sciToggleStoryAudio(); return; }
              %orig;
          }
          %end'''
          new_carousel = '''%hook IGSundialViewerCarouselCell
          - (void)gestureController:(id)gc didObserveSingleTap:(id)tap {
              if (!sciIsPhotoMuteEnabled()) {
                  %orig(gc, tap);
                  return;
              }

              BOOL hasVideo = NO;
              BOOL hasPhoto = NO;
              NSMutableArray<UIView *> *stack = [NSMutableArray arrayWithObject:self];
              for (int depth = 0; depth < 6 && stack.count && !hasVideo; depth++) {
                  NSMutableArray<UIView *> *next = [NSMutableArray array];
                  for (UIView *subview in stack) {
                      NSString *className = NSStringFromClass([subview class]);
                      if ([className isEqualToString:@"IGSundialViewerCarouselVideoCell"]) {
                          if (!CGRectIsEmpty(CGRectIntersection(subview.bounds, self.bounds)) &&
                              subview.window) {
                              hasVideo = YES;
                          }
                      } else if ([className isEqualToString:@"IGSundialViewerCarouselPhotoCell"]) {
                          if (!CGRectIsEmpty(CGRectIntersection(subview.bounds, self.bounds)) &&
                              subview.window) {
                              hasPhoto = YES;
                          }
                      }
                      for (UIView *child in subview.subviews) {
                          [next addObject:child];
                      }
                  }
                  stack = next;
              }

              if (hasPhoto && !hasVideo) {
                  sciToggleStoryAudio();
                  return;
              }

              %orig(gc, tap);
          }
          %end'''

          replacements = [
              (old_photo, new_photo, "photo cell"),
              (old_carousel_photo, new_carousel_photo, "carousel photo cell"),
              (old_carousel, new_carousel, "carousel cell"),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Features/Reels/EnhancedPlayback.xm
          git diff --cached --check
          git commit -m "fix: expand enhanced playback Logos tap hooks"
          git push origin HEAD:codex/ios27-universal-dylib
