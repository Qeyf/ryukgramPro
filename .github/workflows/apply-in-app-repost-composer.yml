name: Apply In-App Repost Composer Sources

on:
  push:
    branches:
      - codex/in-app-repost-composer

permissions:
  contents: write

jobs:
  apply-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/in-app-repost-composer
          fetch-depth: 2

      - name: Materialize composer automation sources
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=''
          printf '%s' "$PAYLOAD" | base64 --decode > /tmp/repost-composer.tar.gz
          tar -xzf /tmp/repost-composer.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/apply-in-app-repost-composer.yml .github/repost-composer-trigger

      - name: Commit generated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: automate repost through Instagram composer'
          git push origin HEAD:codex/in-app-repost-composer
