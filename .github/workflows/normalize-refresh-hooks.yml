name: Normalize Refresh Logos Branches

on:
  push:
    branches:
      - codex/ios27-universal-dylib
    paths:
      - .github/workflows/normalize-refresh-hooks.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios27-universal-dylib
          fetch-depth: 0

      - name: Expand orig branches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Features/General/DisableBackgroundRefresh.x")
          text = path.read_text()
          replacements = {
              'if (!noRefresh && !noScroll) { %orig; return; }': '''if (!noRefresh && !noScroll) {
              %orig;
              return;
          }''',
              'if (!onFeedTab) { %orig; return; }': '''if (!onFeedTab) {
              %orig;
              return;
          }''',
              'if (!sciDisableReelsRefresh()) { %orig; return; }': '''if (!sciDisableReelsRefresh()) {
              %orig;
              return;
          }''',
              'if (!onReelsTab) { %orig; return; }': '''if (!onReelsTab) {
              %orig;
              return;
          }''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Features/General/DisableBackgroundRefresh.x
          git diff --cached --check
          git commit -m "fix: expand refresh Logos orig branches"
          git push origin HEAD:codex/ios27-universal-dylib
